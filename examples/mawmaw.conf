# ── MAWMAW minimal config with explicit routing ──────────────────────────

[ingestor]
id     = dummy
plugin = ./plugin_dummy.so
as     = dummys

[publisher]
id   = telemetry
type = telemetry

# [publisher]
# id   = stdout
# type = stdout

[publisher]
id   = ws_live
type = websocket
port = 9001

[script]
id      = wasm_passthrough5
runtime = wasm
path    = ./scripts/passthrough.wasm
trigger = dummys
emits   = wasm_output5
window  = dummys, count, 16

[script]
id      = wasm_passthrough1
runtime = wasm
path    = ./scripts/passthrough.wasm
trigger = dummys
emits   = wasm_output1
window  = dummys, count, 16

[script]
id      = py_passthrough
runtime = python
path    = ./scripts/passthrough.py
trigger = dummys
emits   = py_output
window  = dummys, count, 16

[routes]
# Ingestor stream goes to all three scripts
dummys        = wasm_passthrough5, wasm_passthrough1, py_passthrough

# Each script's renamed output goes to a different destination
# wasm_output5  = stdout
wasm_output1  = telemetry
py_output     = ws_live, telemetry

# Internal telemetry metrics must be routed to the telemetry publisher
telemetry     = telemetry